[project]
name = "plant-care-rag"
version = "0.1.0"
description = "RAG assistant for tissue-culture aroid care, with an evaluation harness and a documented latency/quality tradeoff pass"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
