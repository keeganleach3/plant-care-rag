name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: plant
          POSTGRES_PASSWORD: plant
          POSTGRES_DB: plantcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plant -d plantcare"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://plant:plant@localhost:5432/plantcare  # keegan-code:allow secret — ephemeral CI service fixture, same plant/plant credential already committed in .env.example and docker-compose.yml, not a live credential
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.10"
      - run: uv sync --frozen
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"  # playwright is only for the local page sweep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build  # also type-checks
